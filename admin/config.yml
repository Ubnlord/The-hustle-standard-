# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: Ubnlord/The-hustle-standard-
  branch: main

media_folder: media
public_folder: /media

collections:
  - name: products
    label: Products
    label_singular: Product
    folder: data/products
    create: true
    delete: true
    format: json
    extension: json
    identifier_field: id
    summary: "{{name}} — {{status}}"
    fields:
      - { name: id, label: ID (slug), widget: string, hint: "e.g. no-excuses (must be unique, lowercase, no spaces)" }
      - { name: name, label: Product Name, widget: string }
      - { name: collection, label: Collection, widget: string, default: "THE DISCIPLINE DROP" }
      - { name: category, label: Category, widget: select, options: ["T-Shirt", "Hoodie", "Cap", "Other"], default: "T-Shirt" }
      - { name: status, label: Status, widget: select, options: ["NEW DROP", "AVAILABLE", "COMING SOON", "SOLD OUT", "PRE-ORDER"], default: "NEW DROP" }
      - { name: price, label: Price (leave empty for "Price on Request"), widget: number, required: false, value_type: float }
      - { name: colors, label: Colors, widget: list, field: { name: color, label: Color, widget: string }, default: ["Black", "Charcoal", "Sand", "White"] }
      - { name: sizes, label: Sizes, widget: list, field: { name: size, label: Size, widget: string }, default: ["S", "M", "L", "XL", "XXL"] }
      - { name: image, label: Main Product Image, widget: image, required: false }
      - { name: images, label: Additional Images, widget: list, field: { name: image, label: Image, widget: image }, required: false }
